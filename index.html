<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pulsar Comercial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap">
<script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<style>
/* Layout: mesmo sistema visual do painel ID Cliente — header navy, filtros, KPIs, abas em pílula, conteúdo por aba */
:root{
  --radius:.75rem;
  --background:oklch(0.97 0.005 220); --foreground:oklch(0.17 0.04 240);
  --card:oklch(1 0 0);
  --primary:oklch(0.76 0.19 152); --primary-fg:oklch(0.13 0.05 240);
  --muted:oklch(0.94 0.008 220); --muted-fg:oklch(0.50 0.025 230);
  --accent:oklch(0.72 0.17 210); --accent-ink:oklch(0.52 0.14 220);
  --destructive:oklch(0.58 0.21 22);
  --warning:oklch(0.78 0.16 70); --warning-ink:oklch(0.56 0.14 60);
  --success:oklch(0.76 0.19 152); --success-ink:oklch(0.52 0.15 152);
  --border:oklch(0.90 0.01 220);
  --chart-3:oklch(0.55 0.22 264);
  --gradient-primary:linear-gradient(135deg,oklch(0.17 0.06 242) 0%,oklch(0.22 0.06 238) 100%);
  --shadow-card:0 1px 2px oklch(0.17 0.04 240 / .05),0 8px 24px -12px oklch(0.17 0.04 240 / .12);
  --shadow-elevated:0 2px 4px oklch(0.17 0.04 240 / .06),0 20px 40px -16px oklch(0.17 0.04 240 / .2);
  --font-display:"Sora",ui-sans-serif,system-ui,sans-serif; --font-sans:"Manrope",ui-sans-serif,system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --background:oklch(0.15 0.03 240); --foreground:oklch(0.96 0.01 200); --card:oklch(0.19 0.04 238);
  --muted:oklch(0.26 0.04 238); --muted-fg:oklch(0.68 0.02 220);
  --accent-ink:oklch(0.78 0.14 210); --destructive:oklch(0.65 0.2 22);
  --warning:oklch(0.80 0.15 75); --warning-ink:oklch(0.82 0.14 75); --success-ink:oklch(0.78 0.18 152);
  --border:oklch(1 0 0 / 10%); --chart-3:oklch(0.68 0.2 264);
  --gradient-primary:linear-gradient(135deg,oklch(0.13 0.06 242) 0%,oklch(0.19 0.06 238) 100%);
  --shadow-card:0 1px 2px oklch(0 0 0 / .3),0 8px 24px -12px oklch(0 0 0 / .5);
  --shadow-elevated:0 2px 4px oklch(0 0 0 / .3),0 20px 40px -16px oklch(0 0 0 / .6); color-scheme:dark}}
:root[data-theme="dark"]{
  --background:oklch(0.15 0.03 240); --foreground:oklch(0.96 0.01 200); --card:oklch(0.19 0.04 238);
  --muted:oklch(0.26 0.04 238); --muted-fg:oklch(0.68 0.02 220);
  --accent-ink:oklch(0.78 0.14 210); --destructive:oklch(0.65 0.2 22);
  --warning:oklch(0.80 0.15 75); --warning-ink:oklch(0.82 0.14 75); --success-ink:oklch(0.78 0.18 152);
  --border:oklch(1 0 0 / 10%); --chart-3:oklch(0.68 0.2 264);
  --gradient-primary:linear-gradient(135deg,oklch(0.13 0.06 242) 0%,oklch(0.19 0.06 238) 100%);
  --shadow-card:0 1px 2px oklch(0 0 0 / .3),0 8px 24px -12px oklch(0 0 0 / .5);
  --shadow-elevated:0 2px 4px oklch(0 0 0 / .3),0 20px 40px -16px oklch(0 0 0 / .6); color-scheme:dark}
*{box-sizing:border-box;border-color:var(--border)}
[hidden]{display:none!important}   /* elementos escondidos (ex.: selo de Desenvolvimento) não aparecem mesmo com display próprio */
body{background:var(--background);color:var(--foreground);font-family:var(--font-sans);-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.5;padding-bottom:64px}
h1,h2,h3,h4{font-family:var(--font-display);margin:0;text-wrap:balance}
p{margin:0}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
svg.lucide{width:16px;height:16px;flex:none}
.tnum{font-variant-numeric:tabular-nums}
.mf{color:var(--muted-fg)}
.wrap{max-width:80rem;margin:0 auto;padding-inline:16px;display:flex;flex-direction:column;gap:20px}
@media (min-width:640px){.wrap{padding-inline:24px}}
@media (min-width:1024px){.wrap{padding-inline:32px}}

/* Header */
.hero{position:relative;overflow:hidden;background:var(--gradient-primary);border-bottom:1px solid var(--border);margin-bottom:20px}
.hero .blob1{position:absolute;right:-80px;top:-80px;width:256px;height:256px;border-radius:50%;background:oklch(0.76 0.19 152 / .2);filter:blur(64px)}
.hero .blob2{position:absolute;left:25%;bottom:-96px;width:224px;height:224px;border-radius:50%;background:oklch(0.76 0.19 152 / .1);filter:blur(64px)}
.hero .in{position:relative;padding-block:24px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}
.brand{display:flex;gap:12px;align-items:center}
.brand .ic{width:44px;height:44px;border-radius:12px;background:var(--primary);color:var(--primary-fg);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 15px -3px oklch(0 0 0 / .25)}
.brand .ic svg{width:24px;height:24px}
.eyebrow{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:oklch(1 0 0 / .6)}
.hero h1{font-size:clamp(24px,3vw,30px);font-weight:800;color:#fff;letter-spacing:.02em}
.hero .desc{font-size:14px;color:oklch(1 0 0 / .7);margin-top:2px}
.hero .chips{display:flex;flex-wrap:wrap;gap:8px}
.glass{display:flex;align-items:center;gap:8px;border-radius:12px;background:oklch(1 0 0 / .1);padding:8px 16px;font-size:14px;color:#fff;font-weight:500}
.glass svg{color:var(--primary)}
.glass.demo svg{color:var(--warning)}

/* Cards */
.card{border:1px solid var(--border);background:var(--card);border-radius:20px;box-shadow:var(--shadow-card)}
.card-hd{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--border);padding:20px}
.card-hd h2{font-size:18px;font-weight:700}
.card-hd p{font-size:14px;color:var(--muted-fg)}
.icchip{width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none}
.icchip svg{width:20px;height:20px}
.t-primary{color:var(--success-ink);background:oklch(0.76 0.19 152 / .12)}
.t-warning{color:var(--warning-ink);background:oklch(0.78 0.16 70 / .15)}
.t-destructive{color:var(--destructive);background:oklch(0.58 0.21 22 / .1)}
.t-accent{color:var(--accent-ink);background:oklch(0.72 0.17 210 / .12)}

/* Filtros */
.filter{padding:16px 20px;display:flex;flex-direction:column;gap:12px}
.filter .row{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.filter .ttl{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px}
.filter .ttl svg{color:var(--success-ink)}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld label{font-size:12px;font-weight:600;color:var(--muted-fg)}
select,input,textarea{height:36px;border:1px solid var(--border);border-radius:10px;background:var(--background);padding:0 12px;min-width:170px;max-width:100%}
textarea{height:auto;min-height:80px;padding:8px 12px;resize:vertical;width:100%}
select:focus-visible,input:focus-visible,textarea:focus-visible,button:focus-visible,tr:focus-visible{outline:2px solid var(--primary);outline-offset:2px}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:1024px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.datas{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--border);padding-top:12px}
.datas .dh{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.datas .dl{display:flex;gap:6px;align-items:center;font-size:12px;font-weight:700;color:var(--muted-fg)}
.datas .dl svg{color:var(--success-ink)}
.datas .per{font-weight:800;font-size:13px}
.datas .pres{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.datas .pres button{border:1px solid var(--border);background:var(--card);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;color:var(--muted-fg)}
.datas .pres button:hover{color:var(--foreground);border-color:var(--muted-fg)}
.dias{display:flex;flex-wrap:wrap;gap:4px}
.dia{width:42px;border:1px solid var(--border);background:var(--background);border-radius:10px;padding:4px 0;display:flex;flex-direction:column;align-items:center;line-height:1.15;color:var(--muted-fg)}
.dia b{font-family:var(--font-display);font-size:14px;color:var(--foreground);font-variant-numeric:tabular-nums}
.dia small{font-size:10px;font-weight:600}
.dia:hover{border-color:var(--muted-fg)}
.dia{opacity:.55}
.dia.on{opacity:1;background:var(--card);border-color:var(--foreground);color:var(--foreground);box-shadow:var(--shadow-card)}
.dia.on b{color:var(--foreground)}
.dia.fds{border-style:dashed}
.dica{font-size:11px;color:var(--muted-fg)}
.kpi{padding:20px;transition:box-shadow .2s;min-width:0}
.kpi:hover{box-shadow:var(--shadow-elevated)}
.kpi .top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.kpi .lbl{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;color:var(--muted-fg)}
.kpi .val{margin-top:8px;font-family:var(--font-display);font-size:clamp(22px,2.6vw,30px);font-weight:700;font-variant-numeric:tabular-nums}
.kpi .ic{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none}
.kpi .ic svg{width:20px;height:20px}
.kpi .ft{margin-top:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.kpi .ft p{font-size:12px;color:var(--muted-fg)}
.delta{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 8px;font-size:12px;font-weight:600;white-space:nowrap}
.delta svg{width:14px;height:14px}
.up{background:oklch(0.76 0.19 152 / .12);color:var(--success-ink)}
.down{background:oklch(0.58 0.21 22 / .12);color:var(--destructive)}
.flat{background:var(--muted);color:var(--muted-fg)}
.wait{background:oklch(0.78 0.16 70 / .15);color:var(--warning-ink)}
.prog{height:6px;border-radius:999px;background:var(--muted);position:relative;margin-top:10px}
.prog i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--primary)}
.prog b{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--foreground);border-radius:2px}

/* Indicadores */
.indic{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.indic>div{padding:14px 20px;border-right:1px solid var(--border);display:flex;flex-direction:column;gap:2px;min-width:0}
.indic>div:last-child{border-right:0}
.indic .l{font-size:12px;font-weight:600;color:var(--muted-fg);display:flex;align-items:center;gap:6px}
.indic .v{font-family:var(--font-display);font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.indic .s{font-size:12px;color:var(--muted-fg)}

/* Abas */
.tabs{padding:6px}
.tabs .in{display:flex;gap:4px;overflow-x:auto}
.tab{flex:1;min-width:max-content;display:flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:10px 16px;font-size:14px;font-weight:700;border:0;background:transparent;color:var(--muted-fg);white-space:nowrap;transition:background .15s,color .15s}
.tab:hover{background:var(--muted);color:var(--foreground)}
.tab.on{background:var(--primary);color:var(--primary-fg);box-shadow:0 4px 6px -1px oklch(0 0 0 / .12)}
.tab .cnt{border-radius:999px;padding:1px 8px;font-size:11px;font-weight:800;background:var(--destructive);color:#fff}
.tab.on .cnt{background:oklch(1 0 0 / .3);color:var(--primary-fg)}

/* Plano do dia */
.sec{display:flex;flex-direction:column;gap:20px}
.plan-hd{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px}
.plan-hd h2{font-size:20px;font-weight:700}
.plan-hd p{color:var(--muted-fg);font-size:14px}
.legend-sev{display:flex;flex-wrap:wrap;gap:8px}
.acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,520px),1fr));gap:16px}
.act{padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0;position:relative;overflow:hidden}
.act::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--sevc)}
.act.crit{--sevc:var(--destructive)} .act.alto{--sevc:var(--warning)} .act.medio{--sevc:var(--accent)} .act.pos{--sevc:var(--primary)}
.act .hd{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.act .hd .l{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sev{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.04em}
.sev svg{width:14px;height:14px}
.sev.crit{background:oklch(0.58 0.21 22 / .12);color:var(--destructive)}
.sev.alto{background:oklch(0.78 0.16 70 / .18);color:var(--warning-ink)}
.sev.medio{background:oklch(0.72 0.17 210 / .14);color:var(--accent-ink)}
.sev.pos{background:oklch(0.76 0.19 152 / .14);color:var(--success-ink)}
.tag{font-size:12px;font-weight:600;color:var(--muted-fg);background:var(--muted);border-radius:999px;padding:3px 10px}
.imp{text-align:right}
.imp b{font-family:var(--font-display);font-size:20px;font-weight:700;color:var(--destructive);font-variant-numeric:tabular-nums}
.act.pos .imp b{color:var(--success-ink)}
.imp small{display:block;font-size:11px;color:var(--muted-fg);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.act h3{font-size:17px;font-weight:700;display:flex;gap:8px;align-items:center}
.act h3 svg{width:20px;height:20px;color:var(--sevc)}
.evid{font-size:14px;color:var(--muted-fg)}
.evid b{color:var(--foreground)}
.todo{border-radius:14px;background:var(--muted);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.todo .th{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px}
.todo .th svg{color:var(--success-ink)}
.todo ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.goal{display:flex;gap:8px;align-items:flex-start;font-size:14px;font-weight:600;border:1px dashed var(--border);border-radius:12px;padding:10px 12px}
.goal svg{color:var(--success-ink);margin-top:2px}
.act .ft{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.btn{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:10px;padding:9px 16px;font-weight:700;font-size:14px;background:var(--primary);color:var(--primary-fg)}
.btn:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;color:var(--muted-fg);padding:9px 10px}
.btn.ghost:hover{background:var(--muted);color:var(--foreground)}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
.done{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:13px;color:var(--success-ink)}
.alt{font-size:12px;color:var(--muted-fg)}

/* Tabelas */
.tw{overflow-x:auto}
.tw.tall{max-height:36rem;overflow-y:auto}
.tcons tfoot td{position:sticky;bottom:0;background:var(--card);border-top:2px solid var(--foreground);box-shadow:0 -6px 12px -10px oklch(0 0 0 / .4);z-index:1}
.sc{display:inline-block;margin-left:5px;border-radius:6px;padding:0 5px;font-size:11px;font-weight:800;font-variant-numeric:tabular-nums;vertical-align:1px}
.sc.pos{background:oklch(0.76 0.19 152 / .15);color:var(--success-ink)} .sc.neg{background:oklch(0.58 0.21 22 / .12);color:var(--destructive)}
.scT{display:inline-block;min-width:46px;text-align:center;border-radius:8px;padding:2px 8px;font-weight:800;font-family:var(--font-display)}
.scT.crit{background:var(--destructive);color:#fff} .scT.alto{background:var(--warning);color:oklch(0.25 0.06 70)} .scT.medio{background:var(--muted)} .scT.pos{background:var(--primary);color:var(--primary-fg)}
table{width:100%;border-collapse:collapse;font-size:14px}
thead{position:sticky;top:0;z-index:1;background:var(--card)}
th{padding:12px 8px;text-align:left;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;color:var(--muted-fg);border-bottom:1px solid var(--border);white-space:nowrap}
th:first-child,td:first-child{padding-left:20px}
th:last-child,td:last-child{padding-right:20px}
th.s{cursor:pointer;user-select:none}
th.s:hover{color:var(--foreground)}
th .si{display:inline-flex;align-items:center;gap:4px}
th .si svg{width:12px;height:12px;opacity:.4}
th.on .si svg{opacity:1;color:var(--success-ink)}
td{padding:11px 8px;border-bottom:1px solid var(--border);white-space:nowrap;vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background .15s}
tbody tr:hover{background:oklch(0.94 0.008 220 / .4)}
tr.click{cursor:pointer}
tr.sel{background:oklch(0.76 0.19 152 / .08)}
.r{text-align:right}
td .nm{font-weight:600}
td .sub{font-size:12px;color:var(--muted-fg)}
.pill{display:inline-flex;align-items:center;border-radius:999px;padding:2px 8px;font-size:12px;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.p-ok{background:oklch(0.76 0.19 152 / .12);color:var(--success-ink)}
.p-warn{background:oklch(0.78 0.16 70 / .16);color:var(--warning-ink)}
.p-bad{background:oklch(0.58 0.21 22 / .12);color:var(--destructive)}
.c-ok{color:var(--success-ink)} .c-warn{color:var(--warning-ink)} .c-bad{color:var(--destructive)}
.minibar{display:flex;align-items:center;gap:8px}
.minibar .b{height:6px;width:64px;border-radius:999px;background:var(--muted);overflow:hidden;position:relative}
.minibar .b i{position:absolute;inset:0 auto 0 0;border-radius:999px}
.gchips{display:flex;gap:4px;flex-wrap:wrap}
.gdot{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 8px;font-size:11px;font-weight:700}

/* Loja em foco */
.focus{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px}
@media (max-width:1000px){.focus{grid-template-columns:minmax(0,1fr)}}
.pad{padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.minis{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:12px}
.minis div{display:flex;flex-direction:column}
.minis .l{font-size:12px;font-weight:600;color:var(--muted-fg)}
.minis .v{font-family:var(--font-display);font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.chart svg{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--border)}
.chart .ax{fill:var(--muted-fg);font:600 11px var(--font-sans)}
.chart .esp{fill:none;stroke:var(--muted-fg);stroke-width:1.5;stroke-dasharray:5 5}
.chart .real{fill:none;stroke:var(--chart-3);stroke-width:2.5;stroke-linejoin:round}
.chart .area{fill:var(--chart-3);opacity:.1}
.chart .proj{stroke:var(--chart-3);stroke-width:1.5;stroke-dasharray:2 4}
.chart .dot{fill:var(--chart-3)}
.chart .mk line{stroke:var(--warning);stroke-width:1.5;stroke-dasharray:2 3}
.chart .mk circle{fill:var(--warning)}
.chart .mk text{fill:oklch(0.25 0.06 70);font:800 10px var(--font-sans)}
.chart .hoje{stroke:var(--foreground);opacity:.25}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted-fg);font-weight:600}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:18px;border-top:2.5px solid var(--chart-3)}
.legend i.e{border-top:1.5px dashed var(--muted-fg)}
.legend i.p{border-top:2px dotted var(--chart-3)}
.legend i.a{width:10px;height:10px;border:0;border-radius:50%;background:var(--warning)}
.list{display:flex;flex-direction:column}
.list .it{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:start;padding:12px 0;border-top:1px solid var(--border)}
.list .it:first-child{border-top:0}
.dchip{font-size:12px;font-weight:800;border-radius:8px;padding:2px 8px;background:oklch(0.78 0.16 70 / .18);color:var(--warning-ink);font-variant-numeric:tabular-nums}

<script>
/* ================= Configuração ================= */
// Faixas: meta de %B1 da rede e BM alvo por loja (BM Alvo dos consultores do Plano BM ou BM do cluster), lidos em processar_dados.py.
// IPB e preço médio sem faixa oficial: cada loja é comparada com o próprio histórico (3 meses anteriores).
const F={ipb:null,pm:null,b1:null,bt:.32,bp:.30};   // bt/bp: penetração saudável de Boleto Turbinado e Promocional
// Preço médio do item de BT e BP (grades do ciclo; o Ciclo/ciclo_atual.json pode trocar) para estimar a receita perdida
const PRECO={bt:41.17,bp:17.47};

const TIPOS={'Push do time':'megaphone','Treinamento com o time':'graduation-cap','1:1 com consultor':'message-circle','Realocação de consultores':'arrow-left-right','Calçada Perfumada':'footprints','Conversão da Ação de Fluxo':'gift','BT e BP no fechamento':'ticket','Sarrafo do ciclo':'trending-up','Venda fora de loja':'map-pin','Carteira no WhatsApp':'smartphone','Redes sociais':'share-2','Ação de marketing':'sparkles','Ação externa / empresas':'handshake','Transferência de mercadoria':'truck','Alinhamento com gestor':'phone-call','Reconhecimento':'trophy','Outra':'circle-dot'};
const SEV={crit:{n:'Crítico',o:0,ic:'siren'},alto:{n:'Alto',o:1,ic:'triangle-alert'},medio:{n:'Médio',o:2,ic:'info'},pos:{n:'Positivo',o:3,ic:'sparkles'}};
const GT={
  ritmo:{nome:'Loja abaixo da meta',icon:'gauge',acao:'Push do time',
    roteiro:['Abertura de 10 min com a meta de hoje quebrada por consultor; placar às 14h e às 18h']},
  tendencia:{nome:'Ritmo piorando',icon:'trending-down',acao:'Push do time',
    roteiro:['Comparar escala e fluxo dos últimos 3 dias; reforçar a meta do dia e puxar fluxo com Calçada Perfumada e WhatsApp para a carteira']},
  fluxo:{nome:'Poucos boletos',icon:'users',acao:'Calçada Perfumada',
    roteiro:['Calçada Perfumada nos melhores horários de fluxo; venda fora de loja (empresas, condomínios, parcerias); 20 mensagens de WhatsApp para a carteira de clientes; post e stories com a promoção do dia nas redes da loja']},
  ipb:{nome:'IPB abaixo do habitual',icon:'shopping-bag',acao:'Treinamento com o time',
    roteiro:['Treino de 15 min de venda adicional: oferecer o 2º item em todo atendimento, com o Compre e Leve como gancho']},
  btbp:{nome:'Baixa penetração de BT e BP',icon:'ticket',acao:'BT e BP no fechamento',
    roteiro:['Oferecer o BT em todo boleto e 1 PRM de BP a cada sarrafo atingido; placar de BT e BP às 14h e às 18h']},
  b1:{nome:'%B1 acima da meta',icon:'receipt',acao:'Treinamento com o time',
    roteiro:['Briefing de 5 min com o %B1 da véspera e a pergunta de fechamento: oferecer BT/BP no 2º item de todo boleto']},
  bmsaud:{nome:'Boleto médio abaixo do alvo',icon:'wallet',acao:'Treinamento com o time',
    roteiro:['Oferta de BT/BP no fechamento de todo boleto, itens de impulso no caixa e briefing diário com o %B1 da véspera']},
  pm:{nome:'Preço médio abaixo do habitual',icon:'tag',acao:'Transferência de mercadoria',
    roteiro:['Checar ruptura de kits, lançamentos e itens foco; pedir transferência e levar para a área de maior fluxo']},
  anoant:{nome:'Caindo vs ano passado',icon:'trending-down',acao:'Push do time',
    roteiro:['Atacar o indicador que mais caiu contra o ano passado e combinar a meta do dia na abertura']},
  recup:{nome:'Ação gerando resultado',icon:'trophy',acao:'Reconhecimento',
    roteiro:['Reconhecer o time e registrar o que funcionou para replicar']}
};
const MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const SEMANA=['domingo','segunda','terça','quarta','quinta','sexta','sábado'];

/* ================= Dados (dados/pulsar.json, gerado por processar_dados.py) ================= */
let D,ANO,MES,DAYS,LAST,TODAY,REFTXT,lojas=[],cons=[],M={},TEAM={};
let PB=null;                                        // faixas da rede (meta de %B1)
let CICLO=null;                                     // Ciclo/ciclo_atual.json: alavancas comerciais do ciclo vigente
// Liga cada detrator (gatilho ou perfil) à alavanca do ciclo que ataca ele
const CIC_MAPA={fraco:'b1',critico:'b1',btbp:'b1',fluxo:'fluxo',ritmo:'fluxo',tendencia:'fluxo',ipb:'ipb',b1:'b1',pm:'pm',bmsaud:'bmsaud',atende:'fluxo',item:'b1',ticket:'pm',abaixo:'b1'};
function cicloAtivo(){if(!CICLO)return false;const h=`${ANO}-${pad(MES+1)}-${pad(Math.min(TODAY,DAYS))}`;return h>=CICLO.inicio&&h<=CICLO.fim}
// Ações do ciclo vigentes hoje para o detrator, em ordem de prioridade (a 1ª é a principal)
function acoesCiclo(k){
 if(!cicloAtivo()||!CICLO.acoes)return [];
 const h=`${ANO}-${pad(MES+1)}-${pad(Math.min(TODAY,DAYS))}`;
 return (CICLO.acoes[CIC_MAPA[k]||k]||[]).filter(x=>(!x.inicio||h>=x.inicio)&&(!x.fim||h<=x.fim));
}
const alav=k=>acoesCiclo(k)[0]||null;
// Bloco único de ação: AÇÃO + ITEM DO CICLO, com até 2 alternativas. Sem ciclo, usa a ação padrão do gatilho.
function acaoBloco(k,padrao,lider){
 const l=acoesCiclo(k),p=l[0]||padrao,alts=l.slice(1,3);
 return `<div class="do">${ic(TIPOS[p.tipo]||'circle-dot')}<div>${lider?`<span class="lid">${esc(lider)}</span>`:''}<b>${esc(p.acao)}</b><span>${esc(p.detalhe||'')}</span></div></div>`;
}
let SEL=new Set();                                  // dias selecionados no filtro de datas (1..ontem)
const selArr=()=>[...SEL].sort((a,b)=>a-b);
const sum=a=>a.reduce((s,x)=>s+x,0);
const avg=a=>a.length?sum(a)/a.length:null;

function init(json){
 D=json;
 const[y,mo,d]=D.ontem.split('-').map(Number);ANO=y;MES=mo-1;LAST=d;TODAY=d+1;DAYS=D.diasMes;
 const ri=+D.referencia.inicio.slice(5,7)-1,rf=+D.referencia.fim.slice(5,7)-1;
 REFTXT=`${MESES[ri].slice(0,3)}–${MESES[rf].slice(0,3)}`;
 lojas=D.lojas.filter(l=>sum(l.meta)>0);
 cons=juntaDigitais(D.consultores);
 PB=D.planoBM||null;if(PB&&PB.b1Meta)F.b1=PB.b1Meta;
 SEL=new Set(Array.from({length:LAST},(_,i)=>i+1));
 recalc();
}
// Consultores digitais (WhatsApp, várias lojas; lista em processar_dados.py): as entradas de cada loja viram uma pessoa só.
// A "loja" dela é a de maior receita; "lojas" guarda todas. Fica fora do time das lojas e é comparada com o grupo digital.
const SERIES=['rec','bol','it','b1','br','bt','bp','bpe'];
function juntaDigitais(lst){
 const out=[],dg={};
 lst.forEach(c=>{if(!c.digital){out.push(c);return}
  const cod=c.id.split('@')[0],g=dg[cod]=dg[cod]||{id:'dig:'+cod,nome:c.nome,digital:true,lojas:[],_rec:{}};
  if(lojaById(c.loja)){g.lojas.push(c.loja);g._rec[c.loja]=sum(c.rec)}
  SERIES.forEach(k=>{g[k]=g[k]||[];(c[k]||[]).forEach((v,i)=>g[k][i]=(g[k][i]||0)+v)})});
 Object.values(dg).forEach(g=>{if(!g.lojas.length)return;g.loja=[...g.lojas].sort((a,b)=>g._rec[b]-g._rec[a])[0];
  SERIES.forEach(k=>{for(let i=0;i<LAST;i++)g[k][i]=g[k][i]||0});out.push(g)});

function avaliar(ls){

 ls.forEach(l=>{
  const m=M[l.id];if(m.metaAte<=0)return;const PL=`perdidos em ${perTxt()}`;
  if(m.proj<.96)add('ritmo',m.proj<.92?'crit':'alto',{loja:l,imp:-m.gapR,impL:'abaixo da meta até ontem',
   evid:`<b>${pct(m.at,1)}</b> da meta do mês; deveria estar em <b>${pct(m.esp,1)}</b>. No ritmo atual fecha em <b>${pct(m.proj)}</b>.`,meta:metaHojeTxt(m)});
  const rs=m.ritmo.filter(v=>v!=null);
  if(rs.length>=6){const r1=avg(rs.slice(-6,-3)),r2=avg(rs.slice(-3));
   if(r2-r1<=-.15)add('tendencia','alto',{loja:l,imp:(r1-r2)*m.hoje*3,impL:'em risco nos próximos dias',
    evid:`Ritmo diário caiu de <b>${pct(r1)}</b> para <b>${pct(r2)}</b> da meta do dia nos últimos 3 dias com loja aberta.`,meta:metaHojeTxt(m)})}
  if(m.metaP>0&&m.dBol<=-.08)add('fluxo',m.dBol<=-.15?'crit':'alto',{loja:l,imp:-m.iBol,impL:PL,
   evid:`<b>${fx(m.bol)}</b> boletos; com o BM alvo de <b>${brl(m.bmAlvoV,2)}</b>, a meta pedia <b>${fx(m.bolEsp)}</b> (<b>${pct(m.dBol,1,true)}</b>).`,
   meta:`${fx(m.hoje/(m.bmAlvoV||m.bm))} boletos hoje (média atual ${fx(m.bol/m.nd)} por dia)`});
  const lim=.01*m.metaP;
  if(m.bol&&m.iIpb<-lim)add('ipb',m.iIpb<-3*lim?'alto':'medio',{loja:l,imp:-m.iIpb,impL:PL,
   evid:`IPB de <b>${fx(m.ipb,2)}</b> contra o alvo de <b>${fx(m.ipbAlvo,2)}</b> (${fx(m.ipbRef,2)} em ${REFTXT}). B1 em ${pct(m.pb1)} dos boletos.`,meta:`IPB ≥ ${fx(m.ipbAlvo,2)} hoje`});
  const b1Alvo=F.b1||m.b1Ref;
  if(m.bol&&m.pb1>b1Alvo+.03)add('b1',m.pb1>b1Alvo+.08?'alto':'medio',{loja:l,imp:(m.pb1-b1Alvo)*m.bol*m.pm,impL:`potencial em ${perTxt()}`,
   evid:`<b>${pct(m.pb1,1)}</b> dos boletos com 1 item${F.b1?`; a meta é ${pct(F.b1,1)}`:`, contra ${pct(m.b1Ref,1)} em ${REFTXT}`}. Cada p.p. a menos vale <b>${kbrl(m.valorPP)}</b> até o fim do mês.`,
   meta:`%B1 ≤ ${pct(b1Alvo,1)} hoje, sem perder boletos`});

   const longe=m.pBT<F.bt*.5||m.pBP<F.bp*.5;
   add('btbp',longe&&m.perdaBTBP>.03*m.metaP?'alto':'medio',{loja:l,imp:m.perdaBTBP,impL:`estimados em ${perTxt()}`,
    evid:`<b>BT em ${pct(m.pBT,1)}</b> dos boletos (saudável ${pct(F.bt)}) e <b>BP em ${pct(m.pBP,1)}</b> dos boletos a partir de R$ 120 (saudável ${pct(F.bp)}). Faltaram ${fx(m.faltaBT)} boletos com BT e ${fx(m.faltaBP)} com BP.`,
    meta:`hoje, BT em ${pct(F.bt)} dos boletos e BP em ${pct(F.bp)} dos boletos a partir de R$ 120`});
  }
  if(m.bol&&m.bmSaud&&m.bm<m.bmAlvoV*.97){
   add('bmsaud',m.bm<m.bmAlvoV*.9?'alto':'medio',{loja:l,imp:m.potBM,impL:`potencial em ${perTxt()}`,
    evid:`BM de <b>${brl(m.bm,2)}</b> contra o alvo de <b>${brl(m.bmAlvoV,2)}</b> (${brl(l.plano.bmAlvo,2)} com brindes: ${l.plano.bmAlvoFonte==='consultores'?`média do BM Alvo de ${l.plano.bmAlvoN} consultor(es) do Plano BM`:`BM do cluster ${esc((l.plano.cluster||'').toLowerCase())}`}).`,
    meta:`BM ≥ ${brl(m.bmAlvoV,2)} hoje (sem brindes), sem perder boletos`});

   evid:`Preço médio por item de <b>${brl(m.pm,2)}</b> contra o alvo de <b>${brl(m.pmAlvo,2)}</b> (${brl(m.pmRef,2)} em ${REFTXT}). Mix puxado para itens de entrada.`,meta:`Preço médio ≥ ${brl(m.pmAlvo,2)} hoje`});
  // Receita caindo contra o mesmo período do ano passado (lojas com venda nos dois anos).

  if(m.aa.ok&&m.aa.d.rec<=-.05){const y=m.aa,ef=[['fluxo',y.eBol,'Boletos'],['ipb',y.eIpb,'IPB'],['pm',y.ePm,'Preço médio']].sort((p,q)=>p[1]-q[1])[0];

// Time da loja: quem vendeu nos últimos 7 dias e tem receita no mês de pelo menos 20% da mediana dos colegas.
// Abaixo disso é venda pontual (digital, apoio de outra loja): fora da divisão da meta.
const MIN_TIME=.2;
function timeDaLoja(lid){
 const at=cons.filter(c=>c.loja===lid&&!c.digital&&sum(c.rec)>0&&c.bol.slice(Math.max(0,LAST-7),LAST).some(v=>v>0));

 return{time:at.filter(c=>sum(c.rec)>=MIN_TIME*med),fora:at.filter(c=>sum(c.rec)<MIN_TIME*med)};
}

// Régua única: a meta. Cada loja recebe UMA meta de hoje e UM indicador para mover.
// Ranking em uma unidade só: R$ em risco hoje = meta de hoje − venda esperada se repetir o ritmo dos últimos 7 dias.
// Loja sem risco contra a meta, mas 8% ou mais abaixo do ano passado: em risco = venda do mesmo dia do ano passado − esperada.
function ritmoRecente(l){let r=0,mt=0,n=0;for(let d=LAST;d>=1&&n<7;d--)if(l.meta[d-1]>0){r+=l.rec[d-1];mt+=l.meta[d-1];n++}return mt?r/mt:1}
function bolRecente(l){let b=0,n=0;for(let d=LAST;d>=1&&n<7;d--)if(l.meta[d-1]>0&&l.rec[d-1]>0){b+=l.bol[d-1];n++}return n?b/n:0}
const IND={bol:{n:'Boletos',g:'fluxo'},ipb:{n:'IPB',g:'ipb'},pm:{n:'Preço médio',g:'pm'},bm:{n:'Boleto médio',g:'bmsaud'}};
const FMT={bol:v=>`${fx(v)} boletos`,ipb:v=>`IPB ${fx(v,2)}`,pm:v=>`PM ${brl(v,2)}`,bm:v=>`BM ${brl(v)}`};
// Crescimento máximo de boletos contra o mesmo dia da semana do ano passado. Acima disso, o que falta vem do boleto médio.
const CRESC_MAX_BOL=.30;
// Mesmo dia da semana da mesma semana do ano passado: 364 dias antes (14/10/2026, quarta = 15/10/2025, quarta).
// Sem 29/02 no meio, é o dia seguinte do calendário do ano passado. Fora do mês do arquivo do ano passado: sem base.
const diaAA=()=>TODAY+1<=DAYS?TODAY+1:null;
const dataAA=()=>{const d=diaAA();if(!d)return '';const x=new Date(ANO-1,MES,d);return `${['dom','seg','ter','qua','qui','sex','sáb'][x.getDay()]} ${pad(d)}/${pad(MES+1)}/${String(ANO-1).slice(2)}`};
let DEC=[];
function decisao(l){
 const m=M[l.id],mh=TODAY<=DAYS?l.meta[TODAY-1]:0;if(!(mh>0))return null;
 const rr=ritmoRecente(l),esp=mh*rr;let valor=m.hoje-esp,ref='meta';
 if(valor<=0&&m.aa.ok&&m.aa.d.rec<=-.08&&l.aa){const v=l.aa.rec[TODAY-1]||0;if(v>esp){valor=v-esp;ref='aa'}}
 if(valor<=0)return null;
 const bm=m.bmAlvoV||m.bm,need=bm?m.hoje/bm:0,dA=diaAA(),bolAA=dA&&l.aa?l.aa.bol[dA-1]:0;
 const base={loja:l,valor,ref,esp,rr,bolAA,bol7:bolRecente(l)};
 // Com base do ano passado: boletos crescem até 30% sobre o mesmo dia da semana; o resto vem do boleto médio (IPB e PM)
 if(bolAA>0){
  const teto=bolAA*(1+CRESC_MAX_BOL),cresc=need/bolAA-1;
  if(need<=teto){const alvo=Math.max(need,bolAA);
   return{...base,k:'bol',g:'fluxo',alvo,atual:base.bol7,cresc:alvo/bolAA-1,meta:`Meta: ${FMT.bol(alvo)} hoje`}}
  const bmN=m.hoje/teto,kk=m.ipb&&m.pm?Math.sqrt(bmN/(m.ipb*m.pm)):1;
  return{...base,k:'bm',g:'bmsaud',alvo:bmN,bolTeto:teto,cresc,ipbN:m.ipb*kk,pmN:m.pm*kk,atual:m.bm,
   meta:`Meta: BM ${brl(bmN)} hoje (${fx(teto)} boletos, IPB ${fx(m.ipb*kk,2)}, PM ${brl(m.pm*kk,2)})`};
 }
 // Sem ano passado (loja nova ou fim do mês): o indicador abaixo do alvo que mais tira receita
 const ALVO={bol:alvosHoje(m).b,ipb:m.ipbAlvo,pm:m.pmAlvo},ATU={bol:base.bol7,ipb:m.ipb,pm:m.pm},peso={bol:m.iBol,ipb:m.iIpb,pm:m.iPm};
 const abaixo=['bol','ipb','pm'].filter(x=>ALVO[x]>0&&ATU[x]<ALVO[x]);
 const k=abaixo.length?abaixo.sort((p,q)=>peso[p]-peso[q])[0]:['bol','ipb','pm'].sort((p,q)=>ATU[p]/ALVO[p]-ATU[q]/ALVO[q])[0];
 return{...base,k,g:IND[k].g,alvo:ALVO[k],atual:ATU[k],meta:`Meta: ${FMT[k](ALVO[k])} hoje`};
}
// Necessário hoje para o conjunto filtrado: soma dos boletos do "Garantir" de cada loja; BM = meta de hoje ÷ boletos;
// IPB e PM dividem o BM na proporção atual do período
function necessarioHoje(ls,a){
 let bol=0,soma=0;const dA=diaAA();
 ls.forEach(l=>{const m=M[l.id];if(!(m.hoje>0))return;
  const bm=m.bmAlvoV||m.bm,need=bm?m.hoje/bm:0,aa=dA&&l.aa?l.aa.bol[dA-1]:0;
  bol+=aa>0?Math.min(Math.max(need,aa),aa*(1+CRESC_MAX_BOL)):need;soma+=m.hoje});
 const bm=bol?soma/bol:(a.bmAlvoV||a.bm),kk=a.ipb&&a.pm?Math.sqrt(bm/(a.ipb*a.pm)):1;
 return{bol:bm?a.hoje/bm:0,bm,ipb:a.ipb*kk,pm:a.pm*kk};
}

function drawDaily(m,la,sel,el){
 const N=Math.min(TODAY,DAYS),W=720,H=290,L=46,Rr=12,T=40,B=40,iw=W-L-Rr,ih=H-T-B,cw=iw/N,bw=cw*.58;
 const mh=m.metaDays[TODAY-1]||0,need=mh>0?m.hoje/mh:null;
 const e=sel?efeito(m,sel.dia):null;
 const MAX=Math.max(1.3,...m.ritmo.filter(v=>v!=null).map(v=>v*1.12),(need||0)*1.12);
 const xc=d=>L+cw*(d-.5),y=v=>T+(1-Math.min(v,MAX)/MAX)*ih;
 const DS=['dom','seg','ter','qua','qui','sex','sáb'],curto=N>16;
 let g='';
 if(e){g+=`<rect class="win-a" x="${xc(e.ini)-cw/2}" y="${T}" width="${cw*(e.dia-e.ini)}" height="${ih}"/><rect class="win-d" x="${xc(e.dia)-cw/2}" y="${T}" width="${cw*(LAST-e.dia+1)}" height="${ih}"/>
  <text class="wl" x="${xc(e.ini)-cw/2+6}" y="${T+14}">ANTES</text><text class="wl d" x="${xc(e.dia)-cw/2+6}" y="${T+14}">DEPOIS</text>`}
 [0,.5,1,1.5,2,2.5].filter(v=>v<=MAX).forEach(v=>{g+=`<line class="${v===1?'meta1':'grid'}" x1="${L}" x2="${W-Rr}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${L-8}" y="${y(v)+4}" text-anchor="end">${v*100}%</text>`});
 g+=`<text class="mt1" x="${W-Rr-4}" y="${y(1)-6}" text-anchor="end">meta do dia</text>`;
 for(let d=1;d<=N;d++){
  const dow=DS[new Date(ANO,MES,d).getDay()];
  g+=`<text class="ax" x="${xc(d)}" y="${H-22}" text-anchor="middle">${curto?pad(d):dd(d)}</text><text class="ax s" x="${xc(d)}" y="${H-8}" text-anchor="middle">${d===TODAY?'hoje':curto?dow[0]:dow}</text>`;
  if(d<=LAST){const v=m.ritmo[d-1],dep=e&&d>=e.dia;
   if(v==null){g+=`<text class="ax s" x="${xc(d)}" y="${y(0)-6}" text-anchor="middle">fechada</text>`;continue}
   g+=`<rect class="${dep?'bd':'bb'}" x="${xc(d)-bw/2}" y="${y(v)}" width="${bw}" height="${Math.max(1,y(0)-y(v))}" rx="4"><title>${dd(d)}: ${kbrl(m.days[d-1])} vendidos, meta do dia ${kbrl(m.metaDays[d-1])}</title></rect>`;
   g+=`<text class="bl" x="${xc(d)}" y="${y(v)-6}" text-anchor="middle">${pct(v)}</text>`}
  else if(need!=null){g+=`<rect class="bo" x="${xc(d)-bw/2}" y="${y(need)}" width="${bw}" height="${y(0)-y(need)}" rx="4"/><text class="bl o" x="${xc(d)}" y="${y(need)-6}" text-anchor="middle">${pct(need)}</text><text class="ax s" x="${xc(d)}" y="${y(need)+16}" text-anchor="middle">${kbrl(m.hoje)}</text>`}
 }
 if(e){g+=`<line class="avg" x1="${xc(e.ini)-cw/2}" x2="${xc(e.dia)-cw/2}" y1="${y(e.a)}" y2="${y(e.a)}"/><line class="avg d" x1="${xc(e.dia)-cw/2}" x2="${xc(LAST)+cw/2}" y1="${y(e.b)}" y2="${y(e.b)}"/>`;
  if(e.b!==e.a){const xa=xc(e.dia)-cw/2;g+=`<line class="jump" x1="${xa}" x2="${xa}" y1="${y(e.a)}" y2="${y(e.b)}" marker-end="url(#ah)"/>`}}
 const by={};la.forEach(a=>(by[a.dia]=by[a.dia]||[]).push(a));
 Object.entries(by).forEach(([d,arr])=>{d=+d;if(d>N)return;const on=sel&&arr.some(a=>a.id===sel.id),xa=xc(d)-cw/2;
  g+=`<g class="mk ${on?'on':''}" data-acsel="${arr[0].id}" style="cursor:pointer"><title>${esc(arr.map(a=>`${dd(d)} · ${a.tipo}${a.desc?': '+a.desc:''}`).join('\n'))}</title><line x1="${xa}" x2="${xa}" y1="${T-14}" y2="${T+ih}"/><circle cx="${xa}" cy="${T-16}" r="${on?11:9}"/><text x="${xa}" y="${T-12.5}" text-anchor="middle">${arr.length}</text></g>`});
 $(el).innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Venda diária da loja em % da meta do dia, com o antes e o depois da ação selecionada"><defs><marker id="ah" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ahp"/></marker></defs>${g}</svg>`;
}
function efTag(e){return e?`<span class="delta ${e.d>=.05?'up':e.d<=-.05?'down':'flat'}" style="margin-top:6px">${ic(e.d>=0?'arrow-up-right':'arrow-down-right')}Ritmo ${pct(e.a)} → ${pct(e.b)} · ${e.inc>=0?'+':''}${kbrl(e.inc)}</span>`:`<span class="delta wait" style="margin-top:6px">${ic('hourglass')}Aguardando dias de venda para medir</span>`}
function drawChart(m,la,el){
 const W=720,H=270,L=44,Rr=16,T=22,B=30,iw=W-L-Rr,ih=H-T-B,MAX=1.2;
 const x=d=>L+(d-1)/(DAYS-1)*iw,y=p=>T+(1-Math.min(Math.max(p,0),MAX)/MAX)*ih;
 let g='';
 [0,.25,.5,.75,1].forEach(p=>{g+=`<line class="grid" x1="${L}" x2="${W-Rr}" y1="${y(p)}" y2="${y(p)}"/><text class="ax" x="${L-8}" y="${y(p)+4}" text-anchor="end">${p*100}%</text>`});
 [1,5,10,15,20,25,DAYS].forEach(d=>{g+=`<text class="ax" x="${x(d)}" y="${H-8}" text-anchor="middle">${dd(d)}</text>`});
 let ce=0;const esp=m.metaDays.map((v,i)=>{ce+=v;return `${x(i+1)},${y(ce/m.metaMes)}`}).join(' ');
 let acc=0;const pts=m.days.map((v,i)=>{acc+=v;return[x(i+1),y(acc/m.metaMes)]});
 const real=pts.map(p=>p.join(',')).join(' '),last=pts[pts.length-1];
 if(TODAY<=DAYS)g+=`<line class="hoje" x1="${x(TODAY)}" x2="${x(TODAY)}" y1="${T}" y2="${T+ih}"/><text class="ax" x="${x(TODAY)+5}" y="${T+ih-6}">hoje</text>`;
 g+=`<polyline class="esp" points="${esp}"/><polygon class="area" points="${x(1)},${y(0)} ${real} ${x(LAST)},${y(0)}"/><polyline class="real" points="${real}"/>`;
 g+=`<line class="proj" x1="${last[0]}" y1="${last[1]}" x2="${x(DAYS)}" y2="${y(m.proj)}"/><circle class="dot" cx="${x(DAYS)}" cy="${y(m.proj)}" r="4"/><text class="ax" x="${x(DAYS)-8}" y="${y(m.proj)-9}" text-anchor="end">proj. ${pct(m.proj)}</text><circle class="dot" cx="${last[0]}" cy="${last[1]}" r="4.5"/>`;
 const by={};la.forEach(a=>(by[a.dia]=by[a.dia]||[]).push(a));
 Object.entries(by).forEach(([d,arr])=>{d=+d;const tip=arr.map(a=>`${dd(d)} · ${a.tipo}${a.desc?': '+a.desc:''}`).join('\n');
  g+=`<g class="mk"><title>${esc(tip)}</title><line x1="${x(d)}" x2="${x(d)}" y1="${T}" y2="${T+ih}"/><circle cx="${x(d)}" cy="${T-6}" r="9"/><text x="${x(d)}" y="${T-2.5}" text-anchor="middle">${arr.length}</text></g>`});
 $(el).innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Realizado acumulado em % da meta do mês contra a meta diarizada acumulada">${g}</svg>`;
}

 ausente:{n:'Sem venda nos últimos 3 dias',ic:'circle-slash',sev:'alto',o:3,acao:'1:1 com consultor',

function perfil(c){

 const lim=-.03*t.recDia,idx=t.recDia?m.recDia/t.recDia:1;if(!m.dias)return c._p={k:'semdados',t,tl,idx:0,iBol:0,iIpb:0,iPm:0,lim,padrinho:null};

 let k;

 // padrinho: o colega da loja com melhor IPB / preço médio
 const porIpb=['item','fraco','critico'].includes(k);
 const pad_=porIpb?[...pares].sort((a,b)=>b.m.ipb-a.m.ipb)[0]:k==='ticket'?[...pares].sort((a,b)=>b.m.pm-a.m.pm)[0]:null;

}

// ---------- Qualidade do boleto (0–100) e R$ em jogo por dia ----------
// Grupo de comparação: consultores do mesmo cluster (shopping, rua...); os digitais só entre si.
// Cada indicador vira percentil no grupo (0 = pior, 100 = melhor). Quem tem menos de 100 boletos no período é puxado
// para a média do grupo na proporção do volume (com 100 boletos ou mais vale o próprio resultado).
// Qualidade = média ponderada: IPB 4, %B1 3 (menor é melhor), BT+BP contra a meta 2, preço médio 1.
// R$ em jogo por dia = o que o consultor perde por estar abaixo do grupo no IPB e no preço médio (com os mesmos boletos/dia).
// Seguindo a prioridade (IPB pesa mais): preço médio alto NÃO compensa IPB baixo; IPB alto compensa preço médio baixo
// (quem leva mais itens por boleto naturalmente baixa o preço médio).
const PESO_Q={ipb:4,b1:3,btbp:2,pm:1},BOL_PLENO=100;
let QG={};
// QDB é outra marca (preço médio bem menor): compara só com QDB
const grupoCons=c=>{if(c.digital)return 'DIGITAL';const l=lojaById(c.loja)||{};return /^qdb/i.test(l.nome||'')?'QDB':(l.cluster||'—')};
const nomeGrupo=g=>g==='DIGITAL'?'digitais':g==='QDB'?'lojas QDB':`cluster ${nomeCluster(g).toLowerCase()}`;
const btbpIdx=m=>(Math.min(1.5,m.bol?(m.bt/m.bol)/F.bt:0)+Math.min(1.5,m.bpe?(m.bp/m.bpe)/F.bp:0))/2;   // 1 = as duas na meta
function calcQualidade(){
 QG={};
 cons.filter(c=>c.m.bol>0&&c.m.dias>=2).forEach(c=>{(QG[grupoCons(c)]=QG[grupoCons(c)]||{cs:[]}).cs.push(c)});
 for(const g in QG){
  const G=QG[g],T={rec:0,bol:0,it:0,b1:0,bt:0,bp:0,bpe:0};G.cs.forEach(c=>{for(const k in T)T[k]+=c.m[k]||0});
  G.ref={ipb:T.bol?T.it/T.bol:0,pm:T.it?T.rec/T.it:0,b1:T.bol?T.b1/T.bol:0,btbp:btbpIdx(T)};
  const aj=(c,k,v)=>{const w=Math.min(1,c.m.bol/BOL_PLENO);return w*v+(1-w)*G.ref[k]};
  G.v={ipb:[],b1:[],btbp:[],pm:[]};
  G.cs.forEach(c=>{const m=c.m;c._a={ipb:aj(c,'ipb',m.ipb),b1:aj(c,'b1',m.pb1),btbp:aj(c,'btbp',btbpIdx(m)),pm:aj(c,'pm',m.pm)};for(const k in G.v)G.v[k].push(c._a[k])});
  for(const k in G.v)G.v[k].sort((a,b)=>a-b);
 }
}

 const g=grupoCons(c),G=QG[g];
 if(!G||!c._a||G.cs.length<3)return c._q={ok:false,q:0,emJogo:0,p:{}};
 const a=c._a,P={ipb:pctil(G.v.ipb,a.ipb),b1:100-pctil(G.v.b1,a.b1),btbp:pctil(G.v.btbp,a.btbp),pm:pctil(G.v.pm,a.pm)};
 const q=(P.ipb*PESO_Q.ipb+P.b1*PESO_Q.b1+P.btbp*PESO_Q.btbp+P.pm*PESO_Q.pm)/(PESO_Q.ipb+PESO_Q.b1+PESO_Q.btbp+PESO_Q.pm);

  <div class="pfil"><button class="pf ${!S.pfil?'on':''}" data-pfil="">${ic('users')}<span>Todos</span><b>${cs.length}</b></button>${Object.entries(PERFIS).filter(([k])=>cnt[k]).map(([k,P])=>`<button class="pf ${P.sev} ${S.pfil===k?'on':''}" data-pfil="${k}">${ic(P.ic)}<span>${P.n}</span><b>${cnt[k]}</b></button>`).join('')}</div>
  ${tabelaCons(loja,`Consultores de loja (${loja.length})`,'Ordem: R$ em jogo por dia · qualidade do boleto de 0 a 100 = percentil no cluster de IPB (peso 4), %B1 (3), BT + BP contra a meta (2) e preço médio (1); p = percentil de cada indicador','users')}
  ${tabelaCons(dig,`Consultores digitais · WhatsApp (${dig.length})`,`Comparados só entre si (${DIGTEAM.n} digitais) · somam a venda de todas as lojas em que atendem`,'smartphone')}
  ${!loja.length&&!dig.length?'<p class="empty">Nenhum consultor neste filtro.</p>':''}
  ${prio.length?`<div class="plan-hd"><div><h2>Plano de cada consultor</h2><p>Na ordem de prioridade do perfil</p></div></div><div class="acts3">${prio.map(consCard).join('')}</div>`:''}
 </section>`;
 altura15();
}
function icons(){try{window.lucide&&lucide.createIcons()}catch(e){}}

/* ================= Registro de ação ================= */
let CTX=null;
const isoDia=d=>`${ANO}-${pad(MES+1)}-${pad(d)}`;
function abrir(t,lojaId,consId){
 CTX=t||null;
 const ls=escopo(),lid=t?t.loja.id:lojaId||S.foco;
 $('dLoja').innerHTML=ls.map(l=>`<option value="${l.id}">${esc(l.nome)}</option>`).join('');$('dLoja').value=lid;
 fillCons(lid,consId||'');
 $('dTipo').value=t?(t.acao||GT[t.g].acao):'Push do time';
 $('dDia').min=isoDia(1);$('dDia').max=isoDia(DAYS);$('dDia').value=isoDia(Math.min(TODAY,DAYS));$('dDesc').value='';
 $('dCtx').innerHTML=t?`<b>Gatilho:</b> ${GT[t.g].nome} · ${esc(t.loja.nome)}<br><b>Meta da ação:</b> ${t.meta}`:'Ação avulsa, sem gatilho associado.';
 try{$('dAutor').value=$('dAutor').value||localStorage.getItem(KEY_AUTOR)||''}catch(e){}
 $('dlg').showModal();icons();
}
function fillCons(lid,v){const cs=cons.filter(c=>c.loja===lid&&c.m.dias>0).sort((a,b)=>a.nome.localeCompare(b.nome));$('dCons').innerHTML='<option value="">Loja inteira</option>'+cs.map(c=>`<option value="${c.id}">${esc(c.nome)}</option>`).join('');$('dCons').value=v||''}
$('dTipo').innerHTML=Object.keys(TIPOS).map(t=>`<option>${t}</option>`).join('');
$('dLoja').addEventListener('change',e=>fillCons(e.target.value,''));
$('dlgX').onclick=$('dlgCancel').onclick=()=>$('dlg').close();
$('fAcao').addEventListener('submit',e=>{
 e.preventDefault();
 const v=$('dDia').value;if(!v||v.slice(0,7)!==`${ANO}-${pad(MES+1)}`)return;
 const loja=$('dLoja').value;
 const autor=$('dAutor').value.trim();if(!autor){$('dAutor').focus();return}
 try{localStorage.setItem(KEY_AUTOR,autor)}catch(e){}
 registrar({id:Date.now(),autor,mes:v.slice(0,7),dia:+v.slice(8,10),loja,cons:$('dCons').value,tipo:$('dTipo').value,gat:CTX&&CTX.loja.id===loja?CTX.g:'',desc:$('dDesc').value.trim()});
 $('dlg').close();render();toast(PLANILHA.url?'Ação registrada e enviada para a planilha':'Ação registrada neste navegador');
});
function toast(msg){const t=document.createElement('div');t.className='toast';t.innerHTML=`${ic('circle-check')}${esc(msg)}`;document.body.appendChild(t);icons();setTimeout(()=>t.remove(),2600)}

/* ================= Eventos ================= */
// Monta as opções de cada filtro a partir dos filtros acima dele; zera o que deixou de existir.
function fillFiltros(){
 const ord=(a,b)=>a[1].localeCompare(b[1],'pt-BR');
 const opts=(i,todos)=>{
  const [k,f]=NIVEIS[i],base=filtra(i),mapa=new Map();
  base.forEach(l=>mapa.set(f(l),k==='reg'?`${l.regional} · ${l.grvo}`:k==='loja'?l.nome:f(l)));
  const lst=[...mapa].filter(([v])=>v).sort(ord);
  if(S[k]&&!mapa.has(S[k]))S[k]='';
  return `<option value="">${todos}</option>`+lst.map(([v,l])=>`<option value="${esc(v)}">${esc(l)}</option>`).join('');
 };
 [['fReg','Todas as regionais'],['fPraca','Todas as praças'],['fGvo','Todos os GVOs'],['fLoja','Todas as lojas']].forEach(([id,t],i)=>{$(id).innerHTML=opts(i,t);$(id).value=S[NIVEIS[i][0]]});
 const ids=new Set(escopo().map(l=>l.id));
 const cs=cons.filter(c=>ids.has(c.loja)&&sum(c.bol)>0).sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR'));
 if(S.cons&&!cs.some(c=>c.id===S.cons))S.cons='';
 $('fCons').innerHTML='<option value="">Todos os consultores</option>'+cs.map(c=>`<option value="${c.id}">${esc(c.nome)}${S.loja?'':' · '+esc(lojaById(c.loja).nome)}</option>`).join('');
 $('fCons').value=S.cons;
}
// Filtro lembrado neste navegador (o gerente abre direto na loja dele) e link direto: ?loja=ID (ou ?gvo=, ?praca=, ?reg=)
const KEY_FIL='pulsar-filtro-v1';
const lembrarFiltro=()=>{try{localStorage.setItem(KEY_FIL,JSON.stringify({reg:S.reg,praca:S.praca,gvo:S.gvo,loja:S.loja}))}catch(e){}};
function filtroInicial(){
 let f={};try{f=JSON.parse(localStorage.getItem(KEY_FIL))||{}}catch(e){}
 const q=new URLSearchParams(location.search);
 if(['loja','gvo','praca','reg'].some(k=>q.has(k)))f={reg:q.get('reg')||'',praca:q.get('praca')||'',gvo:q.get('gvo')||'',loja:q.get('loja')||''};
 const l=f.loja&&lojaById(f.loja);
 if(l){S.reg=l.regional;S.praca=l.praca;S.gvo=l.gestor;S.loja=l.id;S.foco=l.id}
 else{const ok=(k,fn)=>f[k]&&lojas.some(x=>fn(x)===f[k]);if(ok('reg',x=>x.regional))S.reg=f.reg;if(ok('praca',x=>x.praca))S.praca=f.praca;if(ok('gvo',x=>x.gestor))S.gvo=f.gvo}
}
const setFiltro=(k,v)=>{S[k]=v;S.foco=S.loja||null;fillFiltros();lembrarFiltro();render()};
$('fReg').addEventListener('change',e=>setFiltro('reg',e.target.value));
$('fPraca').addEventListener('change',e=>setFiltro('praca',e.target.value));
$('fGvo').addEventListener('change',e=>setFiltro('gvo',e.target.value));
$('fLoja').addEventListener('change',e=>setFiltro('loja',e.target.value));
$('fCons').addEventListener('change',e=>{S.cons=e.target.value;if(S.cons){S.tab='consultores';S.pfil=''}render()});
$('fToggle').addEventListener('click',()=>{const f=$('fToggle').closest('.filter'),o=f.classList.toggle('open');$('fToggle').setAttribute('aria-expanded',o)});
$('fLimpar').addEventListener('click',()=>{S.reg=S.praca=S.gvo=S.loja=S.cons='';S.foco=null;fillFiltros();lembrarFiltro();render()});

/* ---------- Filtro de datas ---------- */
let ultDia=null;
// Filete de cada data = atingimento do dia no filtro atual (verde ≥ 100%, amarelo ≥ 90%, vermelho abaixo)
let AGG_DIAS=null;
function fillDias(a){
 if(a)AGG_DIAS=a;a=AGG_DIAS;
 const DS=['D','S','T','Q','Q','S','S'];
 $('fDias').innerHTML=Array.from({length:LAST},(_,i)=>{const d=i+1,w=new Date(ANO,MES,d).getDay();
  const mt=a?a.metaDays[d-1]:0,r=mt>0?a.days[d-1]/mt:null,cl=!a||r==null?'':r>=1?'r-ok':r>=.9?'r-mid':'r-no';
  const tt=`${dd(d)}${r==null?'':` · ${pct(r)} da meta do dia`}`;
  return `<button type="button" class="dia ${SEL.has(d)?'on':''} ${w===0?'fds':''} ${cl}" data-dia="${d}" aria-pressed="${SEL.has(d)}" title="${tt}"><b>${pad(d)}</b><small>${DS[w]}</small></button>`}).join('');
}
function setDias(novos){if(!novos.size)return;SEL=novos;recalc();render()}
$('fDias').addEventListener('click',e=>{
 const b=e.target.closest('[data-dia]');if(!b)return;const d=+b.dataset.dia,n=new Set(SEL);
 if(e.shiftKey&&ultDia){const[a,z]=[Math.min(ultDia,d),Math.max(ultDia,d)];for(let x=a;x<=z;x++)n.add(x)}
 else if(n.has(d))n.delete(d);else n.add(d);
 ultDia=d;setDias(n);
});
document.querySelector('.datas .pres').addEventListener('click',e=>{
 const p=e.target.closest('[data-pre]')?.dataset.pre;if(!p)return;
 const r=(a,z)=>new Set(Array.from({length:z-a+1},(_,i)=>a+i));
 setDias(p==='ontem'?r(LAST,LAST):p==='7'?r(Math.max(1,LAST-6),LAST):r(1,LAST));
});
function irFoco(id){if(S.foco!==id)S.acSel=null;S.foco=id;S.tab='lojas';render();requestAnimationFrame(()=>$('foco')?.scrollIntoView({behavior:'smooth',block:'start'}))}
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-tab],[data-reg],[data-foco],[data-del],[data-sort],[data-novo],[data-drill],[data-verc],[data-chart],[data-acsel],[data-pfil],[data-creg],[data-dec],[data-gvo]');if(!t)return;
 const d=t.dataset;
 if(d.dec!=null){const x=DEC[+d.dec];if(!x)return;const cm=comoDecisao(x);abrir({loja:x.loja,g:x.g,meta:x.meta.replace(/^Meta: /,''),acao:cm.tipo});
  if(TIPOS[cm.tipo])$('dTipo').value=cm.tipo;$('dDesc').value=`${x.meta}${cm.txt?' · '+cm.txt:''}`;return}
 if(d.gvo!=null){const l=lojas.find(z=>z.gestor===d.gvo);if(l){S.reg=l.regional;S.praca=l.praca}S.gvo=d.gvo;S.loja='';S.foco=null;fillFiltros();lembrarFiltro();render();$('view').scrollIntoView({behavior:'smooth',block:'start'});return}
 if(d.chart){S.chart=d.chart;render();return}
 if(d.verc){const l=lojaById(d.verc);S.reg=l.regional;S.praca=l.praca;S.gvo=l.gestor;S.loja=l.id;S.cons='';S.tab='consultores';fillFiltros();lembrarFiltro();render();$('view').scrollIntoView({behavior:'smooth',block:'start'});return}
 if(d.pfil!=null){S.pfil=S.pfil===d.pfil?'':d.pfil;render();return}
 if(d.creg){const c=consById(d.creg),p=perfil(c),P=PERFIS[p.k];abrir(null,c.loja,c.id);$('dTipo').value=P.acao;$('dDesc').value=P.passos(c,p)[0].replace(/<[^>]+>/g,'')+(alav(p.k)?` · ${alav(p.k).acao}`:'');$('dCtx').innerHTML=`<b>Perfil:</b> ${P.n} · ${esc(c.nome)} · ${esc(lojaById(c.loja).nome)}`;return}
 if(d.acsel){S.acSel=+d.acsel;S.chart='dia';render();return}
 if(d.drill!=null){S.loja=d.drill;S.foco=S.loja||null;fillFiltros();lembrarFiltro();render();$('view').scrollIntoView({behavior:'smooth',block:'start'});return}
 if(d.tab){S.tab=d.tab;render();return}
 if(d.reg!=null){const t=FIRED[+d.reg];abrir(t);const x=alav(t.g);if(x){if(TIPOS[x.tipo])$('dTipo').value=x.tipo;$('dDesc').value=`${x.acao}: ${x.detalhe||''}`}return}
 if(d.novo){abrir(null,d.novo);return}
 if(d.del){removerAcao(+d.del);render();return}
 if(d.sort){const[tb,k]=d.sort.split(':');const cur=S.sort[tb];S.sort[tb]=cur[0]===k?[k,-cur[1]]:[k,1];render();return}
 if(d.foco){irFoco(d.foco)}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('tr[data-foco]'))irFoco(e.target.dataset.foco)});

/* ================= Início ================= */
function cabecalho(){
 if(CONF.ambiente==='desenvolvimento'){$('hAmb').hidden=false;document.title='[DEV] '+document.title}
 const hoje=new Date(ANO,MES,Math.min(TODAY,DAYS));
 $('hData').textContent=`${SEMANA[hoje.getDay()][0].toUpperCase()+SEMANA[hoje.getDay()].slice(1)}, ${pad(hoje.getDate())} de ${MESES[MES]} de ${ANO} · vendas até ${dd(LAST)}`;
 $('hBase').textContent=`${lojas.length} lojas · atualizado em ${D.geradoEm.slice(8,10)}/${D.geradoEm.slice(5,7)} às ${D.geradoEm.slice(11,16)}`;
}
fetch('Ciclo/ciclo_atual.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).catch(()=>null).then(c=>{CICLO=c}).then(()=>fetch('data/pulsar.json',{cache:'no-store'})).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).then(j=>{
 init(j);cabecalho();filtroInicial();fillFiltros();render();
 sincronizar().then(render);setInterval(()=>sincronizar().then(render),120000);
}).catch(err=>{
 $('view').innerHTML=`<div class="card pad"><h2 style="font-size:18px">Não foi possível carregar os dados</h2><p class="mf">Abra o PULSAR pelo atalho <b>Abrir PULSAR.bat</b>, que processa as planilhas e abre o painel. O arquivo <code>data/pulsar.json</code> precisa existir e a página precisa ser aberta por um servidor local (não direto do arquivo).</p></div>`;
 icons();
});
</script>

# Publica o PULSAR no GitHub Pages com dois ambientes no mesmo site:
#   produção        -> branch main     -> https://fabio-paulo-silva.github.io/PULSAR-COMERCIAL/
#   desenvolvimento -> branch develop  -> https://fabio-paulo-silva.github.io/PULSAR-COMERCIAL/dev/
# Os dados (data/pulsar.json) e o ciclo saem da main e valem para os dois ambientes.
name: Publicar PULSAR

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  montar:
    runs-on: ubuntu-latest
    steps:
      - name: Código de produção (main)
        uses: actions/checkout@v4
        with:
          ref: main
          path: prod

      - name: Código de desenvolvimento (develop)
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: develop
          path: dev

      - name: Montar o site
        run: |
          mkdir -p site/data site/Ciclo
          cp prod/index.html prod/config.js site/
          cp prod/data/*.json site/data/
          if [ -f prod/hoje.html ]; then cp prod/hoje.html site/; fi
          if [ -f prod/beauty.html ]; then cp prod/beauty.html site/; fi
          if [ -f prod/uso.js ]; then cp prod/uso.js site/; fi
          if [ -f prod/data/hoje.json ]; then cp prod/data/hoje.json site/data/; fi
          cp prod/Ciclo/ciclo_atual.json site/Ciclo/
          if [ -f dev/index.html ]; then
            mkdir -p site/dev/data site/dev/Ciclo
            cp dev/index.html dev/config.js site/dev/
            cp prod/data/*.json site/dev/data/
            if [ -f dev/hoje.html ]; then cp dev/hoje.html site/dev/; fi
            if [ -f dev/beauty.html ]; then cp dev/beauty.html site/dev/; fi
            if [ -f dev/uso.js ]; then cp dev/uso.js site/dev/; fi
            if [ -f prod/data/hoje.json ]; then cp prod/data/hoje.json site/dev/data/; fi
            if [ -f dev/Ciclo/ciclo_atual.json ]; then cp dev/Ciclo/ciclo_atual.json site/dev/Ciclo/; else cp prod/Ciclo/ciclo_atual.json site/dev/Ciclo/; fi
          fi
          touch site/.nojekyll
          find site -type f

      # A URL do Apps Script e a chave ficam nos segredos do repositório (Settings > Secrets and variables > Actions),
      # não no código. Sem os segredos a publicação para aqui e o site anterior continua no ar.
      - name: Configurar a planilha de ações (segredos)
        env:
          PLANILHA_URL: ${{ secrets.PULSAR_PLANILHA_URL }}
          PLANILHA_CHAVE: ${{ secrets.PULSAR_PLANILHA_CHAVE }}
        run: |
          if [ -z "$PLANILHA_URL" ] || [ -z "$PLANILHA_CHAVE" ]; then
            echo "::error::Crie os segredos PULSAR_PLANILHA_URL e PULSAR_PLANILHA_CHAVE em Settings > Secrets and variables > Actions."
            exit 1
          fi
          python3 - <<'PY'
          import os, pathlib
          for p in pathlib.Path("site").rglob("config.js"):
              t = p.read_text(encoding="utf-8")
              t = t.replace("__PULSAR_PLANILHA_URL__", os.environ["PLANILHA_URL"]).replace("__PULSAR_PLANILHA_CHAVE__", os.environ["PLANILHA_CHAVE"])
              p.write_text(t, encoding="utf-8")
              print("configurado:", p)
          PY

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publicar:
    needs: montar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

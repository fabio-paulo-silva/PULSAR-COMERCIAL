<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pulsar · Beauty Week</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap">
<script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js" integrity="sha384-hJnF5AwidE18GSWTAGHv3ByzzvfNZ1Tcx5y1UUV3WkauuMCEzBJBMSwSt/PUPXnM" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<style>
/* Mesmo sistema visual do painel do mês (index.html) */
:root{
  --background:oklch(0.97 0.005 220); --foreground:oklch(0.17 0.04 240); --card:oklch(1 0 0);
  --primary:oklch(0.76 0.19 152); --primary-fg:oklch(0.13 0.05 240);
  --muted:oklch(0.94 0.008 220); --muted-fg:oklch(0.50 0.025 230);
  --accent:oklch(0.72 0.17 210); --accent-ink:oklch(0.52 0.14 220);
  --destructive:oklch(0.58 0.21 22); --warning:oklch(0.78 0.16 70); --warning-ink:oklch(0.56 0.14 60);
  --success-ink:oklch(0.52 0.15 152); --border:oklch(0.90 0.01 220); --chart-3:oklch(0.55 0.22 264);
  --gradient-primary:linear-gradient(135deg,oklch(0.17 0.06 242) 0%,oklch(0.22 0.06 238) 100%);
  --shadow-card:0 1px 2px oklch(0.17 0.04 240 / .05),0 8px 24px -12px oklch(0.17 0.04 240 / .12);
  --font-display:"Sora",ui-sans-serif,system-ui,sans-serif; --font-sans:"Manrope",ui-sans-serif,system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --background:oklch(0.15 0.03 240); --foreground:oklch(0.96 0.01 200); --card:oklch(0.19 0.04 238);
  --muted:oklch(0.26 0.04 238); --muted-fg:oklch(0.68 0.02 220); --accent-ink:oklch(0.78 0.14 210);
  --destructive:oklch(0.65 0.2 22); --warning:oklch(0.80 0.15 75); --warning-ink:oklch(0.82 0.14 75);
  --success-ink:oklch(0.78 0.18 152); --border:oklch(1 0 0 / 10%); --chart-3:oklch(0.68 0.2 264);
  --gradient-primary:linear-gradient(135deg,oklch(0.13 0.06 242) 0%,oklch(0.19 0.06 238) 100%);
  --shadow-card:0 1px 2px oklch(0 0 0 / .3),0 8px 24px -12px oklch(0 0 0 / .5); color-scheme:dark}}
:root[data-theme="dark"]{
  --background:oklch(0.15 0.03 240); --foreground:oklch(0.96 0.01 200); --card:oklch(0.19 0.04 238);
  --muted:oklch(0.26 0.04 238); --muted-fg:oklch(0.68 0.02 220); --accent-ink:oklch(0.78 0.14 210);
  --destructive:oklch(0.65 0.2 22); --warning:oklch(0.80 0.15 75); --warning-ink:oklch(0.82 0.14 75);
  --success-ink:oklch(0.78 0.18 152); --border:oklch(1 0 0 / 10%); --chart-3:oklch(0.68 0.2 264);
  --gradient-primary:linear-gradient(135deg,oklch(0.13 0.06 242) 0%,oklch(0.19 0.06 238) 100%);
  --shadow-card:0 1px 2px oklch(0 0 0 / .3),0 8px 24px -12px oklch(0 0 0 / .5); color-scheme:dark}
*{box-sizing:border-box;border-color:var(--border)}
[hidden]{display:none!important}
body{margin:0;background:var(--background);color:var(--foreground);font-family:var(--font-sans);-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.5;padding-bottom:64px}
h1,h2,h3{font-family:var(--font-display);margin:0}
p{margin:0}
button,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
svg.lucide{width:16px;height:16px;flex:none}
.tnum{font-variant-numeric:tabular-nums}
.mf{color:var(--muted-fg)}
.c-ok{color:var(--success-ink)} .c-warn{color:var(--warning-ink)} .c-bad{color:var(--destructive)}
.wrap{max-width:80rem;margin:0 auto;padding-inline:16px;display:flex;flex-direction:column;gap:20px}
@media (min-width:640px){.wrap{padding-inline:24px}}
@media (min-width:1024px){.wrap{padding-inline:32px}}

/* Header */
.hero{position:relative;overflow:hidden;background:var(--gradient-primary);margin-bottom:20px}
.hero .blob{position:absolute;right:-80px;top:-80px;width:256px;height:256px;border-radius:50%;background:oklch(0.76 0.19 152 / .2);filter:blur(64px)}
.hero .in{position:relative;padding-block:24px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}
.brand{display:flex;gap:12px;align-items:center}
.brand .ic{width:44px;height:44px;border-radius:12px;background:var(--primary);color:var(--primary-fg);display:flex;align-items:center;justify-content:center}
.brand .ic svg{width:24px;height:24px}
.eyebrow{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:oklch(1 0 0 / .6)}
.hero h1{font-size:clamp(24px,3vw,30px);font-weight:800;color:#fff;letter-spacing:.02em}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.glass{display:flex;align-items:center;gap:8px;border-radius:12px;background:oklch(1 0 0 / .1);padding:8px 16px;font-size:14px;color:#fff;font-weight:500;text-decoration:none}
.glass svg{color:var(--primary)}
a.glass:hover{background:oklch(1 0 0 / .18)}
.glass.desafio{background:var(--accent);color:oklch(0.15 0.05 240);font-weight:800} .glass.desafio svg{color:oklch(0.15 0.05 240)}
.glass.amb{background:var(--warning);color:oklch(0.25 0.06 70);font-weight:800} .glass.amb svg{color:oklch(0.25 0.06 70)}

/* Cards, filtros */
.card{border:1px solid var(--border);background:var(--card);border-radius:20px;box-shadow:var(--shadow-card)}
.pad{padding:20px}
.card-hd{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--border);padding:16px 20px}
.card-hd h2{font-size:18px}
.card-hd p{color:var(--muted-fg)}
.filter{padding:16px 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld label{font-size:12px;font-weight:600;color:var(--muted-fg)}
select{height:36px;border:1px solid var(--border);border-radius:10px;background:var(--background);padding:0 12px;min-width:170px;max-width:100%}
.btn{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:10px;padding:8px 12px;font-weight:700;background:transparent;color:var(--muted-fg)}
.btn:hover{color:var(--foreground)}
.aviso{display:flex;gap:10px;align-items:flex-start;border-radius:14px;padding:12px 16px;background:oklch(0.78 0.16 70 / .15);color:var(--warning-ink);font-weight:600}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:1024px){.kpis{grid-template-columns:1.4fr 1fr 1fr 1fr}}
.kpi{padding:18px 20px;min-width:0;display:flex;flex-direction:column;gap:6px}
.kpi .lbl{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted-fg)}
.kpi .val{white-space:nowrap;font-family:var(--font-display);font-size:clamp(20px,2.3vw,28px);font-weight:800;font-variant-numeric:tabular-nums;line-height:1.15}
.kpi .val small{font-family:var(--font-sans);font-size:14px;font-weight:700;color:var(--muted-fg);margin-left:6px}
.kpi .kl{font-size:13px;color:var(--muted-fg)}
.kpi .kl b{color:var(--foreground)}
.kpi.hero2{background:var(--gradient-primary);border:0;color:#fff}
.kpi.hero2 .lbl,.kpi.hero2 .kl{color:oklch(1 0 0 / .7)} .kpi.hero2 .kl b{color:#fff}
.kpi.hero2 .val{font-size:clamp(26px,3vw,38px)}
.kpi.hero2 .val small{color:oklch(1 0 0 / .75)}
@media (max-width:1023px){.kpi.hero2{grid-column:span 2}}
.prog{position:relative;height:10px;border-radius:999px;background:var(--muted);margin-top:4px}
.prog i{position:absolute;left:0;top:0;bottom:0;border-radius:999px}
.prog b{position:absolute;top:-4px;bottom:-4px;width:3px;border-radius:2px;background:var(--foreground)}
.ritmo{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;width:max-content}
.ritmo.ok{background:var(--primary);color:var(--primary-fg)} .ritmo.warn{background:var(--warning);color:oklch(0.25 0.06 70)} .ritmo.bad{background:var(--destructive);color:#fff}
.ind{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.ind div{border-radius:14px;background:var(--card);border:1px solid var(--border);padding:10px 14px;display:flex;flex-direction:column}
.ind span{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted-fg)}
.ind b{font-family:var(--font-display);font-size:20px;font-variant-numeric:tabular-nums}
.ind small{font-size:12px;color:var(--muted-fg)}

/* Gráfico */
.tw{overflow-x:auto}
.chart svg{display:block;width:100%;height:auto}
.chart .grid{stroke:var(--border)} .chart .ax{fill:var(--muted-fg);font:600 11px var(--font-sans)}
.chart .hb{fill:var(--chart-3);opacity:.35} .chart .hb.now{opacity:.6}
.chart .esp{fill:none;stroke:var(--muted-fg);stroke-width:2;stroke-dasharray:6 4}
.chart .rl{fill:none;stroke:var(--foreground);stroke-width:2.4;stroke-linejoin:round}
.chart .mt{stroke:var(--success-ink);stroke-width:1.5;stroke-dasharray:3 4}
.chart .mtl{fill:var(--success-ink);font:800 11px var(--font-sans)}
.chart .agora{stroke:var(--warning);stroke-width:2}
.chart .rd{stroke:var(--card);stroke-width:2} .chart .rd.ok{fill:var(--success-ink)} .chart .rd.no{fill:var(--destructive)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted-fg);font-weight:600;margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:18px}
.legend .l-rl{border-top:2.5px solid var(--foreground)} .legend .l-esp{border-top:2px dashed var(--muted-fg)}
.legend .l-hb{height:10px;width:12px;border-radius:3px;background:var(--chart-3);opacity:.45} .legend .l-mt{border-top:1.5px dashed var(--success-ink)}

/* Tabelas */
table{width:100%;border-collapse:collapse;font-size:13px}
th{position:sticky;top:0;background:var(--card);text-align:left;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--muted-fg);padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
th.s{cursor:pointer;user-select:none} th.s:hover{color:var(--foreground)} th.on{color:var(--foreground)}
td{padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:middle;white-space:nowrap}
.r{text-align:right}
tr.click{cursor:pointer} tr.click:hover td{background:var(--muted)}
.nm{font-weight:700} .sub{font-size:12px;color:var(--muted-fg)}
.tall{max-height:620px;overflow:auto}
.bar{display:flex;align-items:center;gap:8px;min-width:120px}
.bar span{flex:1;height:6px;border-radius:999px;background:var(--muted);position:relative;overflow:hidden}
.bar span i{position:absolute;left:0;top:0;bottom:0;border-radius:999px}
.mais{padding:12px 20px}
.lk{border:0;background:none;padding:0;font-weight:700;color:var(--foreground);text-decoration:underline;text-underline-offset:2px;cursor:pointer}
@media (max-width:640px){.filter select{min-width:0;width:100%}.fld{flex:1 1 140px}}
</style>

<style>
/* Beauty Week */
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--border);background:var(--card);border-radius:12px;padding:9px 16px;font-weight:800;color:var(--muted-fg)}
.tab.on{background:var(--foreground);color:var(--background);border-color:var(--foreground)}
.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:1024px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.rk3{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;align-items:start}
.rkl{max-height:34rem;overflow-y:auto}
.rkr{display:grid;grid-template-columns:30px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:9px 16px;border-top:1px solid var(--border)}
.rkr .pos{font-family:var(--font-display);font-weight:800;color:var(--muted-fg);text-align:right;font-variant-numeric:tabular-nums}
.rkr .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .rkr .sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rkr .v{text-align:right;font-family:var(--font-display);font-weight:800;font-variant-numeric:tabular-nums} .rkr .v small{display:block;font-family:var(--font-sans);font-size:11px;font-weight:600;color:var(--muted-fg)}
.pill{display:inline-flex;align-items:center;border-radius:999px;padding:3px 9px;font-size:12px;font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums}
.pill.ok{background:oklch(0.76 0.19 152 / .16);color:var(--success-ink)} .pill.warn{background:oklch(0.78 0.16 70 / .2);color:var(--warning-ink)} .pill.bad{background:oklch(0.58 0.21 22 / .14);color:var(--destructive)}
.nota{font-size:12px;color:var(--muted-fg)}
.kpi.hero2 .val{white-space:normal} .kpi.hero2 .val small{display:block;margin:2px 0 0}
</style>
</head>
<body>
<header class="hero"><div class="blob"></div>
  <div class="wrap"><div class="in">
    <div class="brand"><div class="ic"><i data-lucide="sparkles"></i></div>
      <div><p class="eyebrow">Acompanhamento</p><h1>BEAUTY WEEK</h1></div></div>
    <div class="chips">
      <div class="glass"><i data-lucide="clock"></i><span id="hData">Carregando…</span></div>
      <a class="glass" href="index.html"><i data-lucide="calendar-days"></i><span>Painel do mês</span></a>
    </div>
  </div></div>
</header>

<main class="wrap">
  <section class="card filter">
    <div class="fld"><label for="fDia">Dia</label><select id="fDia"></select></div>
    <div class="fld"><label for="fReg">Regional</label><select id="fReg"></select></div>
    <div class="fld"><label for="fPraca">Praça</label><select id="fPraca"></select></div>
    <div class="fld"><label for="fGvo">GVO</label><select id="fGvo"></select></div>
    <button class="btn" type="button" id="fLimpar"><i data-lucide="rotate-ccw"></i>Limpar</button>
  </section>
  <nav class="tabs" id="tabs"></nav>
  <div id="aviso"></div>
  <section class="kpis" id="kpis"></section>
  <div class="card pad">
    <div><h2 style="font-size:18px">Vendido × esperado por hora</h2><p class="mf" id="curvaTxt"></p></div>
    <div class="tw"><div class="chart" id="chart"></div></div>
    <div class="legend"><span><i class="l-rl"></i>Vendido acumulado</span><span><i class="l-esp"></i>Esperado acumulado</span><span><i class="l-hb"></i>Vendido na hora</span><span><i class="l-mt"></i>Meta do dia</span></div>
  </div>
  <section class="rk3" id="ranks"></section>
  <div class="card" id="cardLojas"></div>
  <p class="nota" id="regras"></p>
</main>

<script>
const $=id=>document.getElementById(id);
const nf=d=>new Intl.NumberFormat('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});
const fx=(v,d=0)=>nf(d).format(v);
const brl=(v,d=0)=>'R$ '+fx(v,d);
const kbrl=v=>Math.abs(v)>=1e6?'R$ '+fx(v/1e6,2)+' mi':Math.abs(v)>=1e3?'R$ '+fx(v/1e3,1)+' mil':brl(v);
const pct=(v,d=0)=>fx(v*100,d)+'%';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ic=n=>`<i data-lucide="${n}"></i>`;
const sum=a=>a.reduce((s,x)=>s+x,0);
const tom=r=>r==null?'':r>=1?'ok':r>=.9?'warn':'bad';
const SEMANA=['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
const CANAIS=[['total','Total canais','layers'],['varejo','Varejo','store'],['vd','VD','truck']];
let B=null;const S={canal:'total',dia:'',reg:'',praca:'',gvo:''};

// Parte do dia que já deveria estar vendida até hh:mm, pela curva (participação de cada hora)
function fracao(curva,hm){if(!curva||!hm)return 0;const[h,m]=hm.split(':').map(Number);let f=0;for(let i=0;i<h&&i<24;i++)f+=curva[i];if(h<24)f+=curva[h]*(m/60);return Math.min(1,f)}
const ultimoDia=c=>Object.keys(B[c].ate||{}).sort().pop()||'';
// fração esperada da loja no dia: dia já fechado = 100%; dia em curso = curva até a hora do último cupom/pedido
function fracLoja(c,l){
 const ate=B[c].ate[l.dia];if(!ate)return 0;
 if(l.dia<ultimoDia(c))return 1;
 const curva=c==='vd'?B.vd.curva:((B.varejo.curvas[l.dia]||{})[l.shopping?'shopping':'demais']);
 return fracao(curva,ate);
}
function linhas(){
 const out=[];
 for(const c of ['varejo','vd'])if(S.canal==='total'||S.canal===c)
  B[c].lojas.forEach(l=>{if(l.dia!==S.dia)return;if(S.reg&&l.regional!==S.reg||S.praca&&l.praca!==S.praca||S.gvo&&l.gvo!==S.gvo)return;
   const f=fracLoja(c,l);out.push({...l,canal:c,f,esp:l.meta*f})});
 return out;
}
const agg=ls=>{const meta=sum(ls.map(l=>l.meta)),real=sum(ls.map(l=>l.real)),esp=sum(ls.map(l=>l.esp));
 return{meta,real,esp,at:meta?real/meta:0,ritmo:esp>0?real/esp:null,proj:esp>0?real/esp*meta:null,f:meta?esp/meta:0}};

function fillFiltros(){
 const todas=[...B.varejo.lojas,...B.vd.lojas];
 const opt=(el,vals,tudo,sel)=>{$(el).innerHTML=`<option value="">${tudo}</option>`+[...new Set(vals)].filter(Boolean).sort().map(v=>`<option ${v===sel?'selected':''}>${esc(v)}</option>`).join('')};
 $('fDia').innerHTML=B.dias.map(d=>{const x=new Date(d+'T12:00');return `<option value="${d}" ${d===S.dia?'selected':''}>${SEMANA[x.getDay()]}, ${d.slice(8)}/${d.slice(5,7)}</option>`}).join('');
 opt('fReg',todas.map(l=>l.regional),'Todas',S.reg);
 opt('fPraca',todas.filter(l=>!S.reg||l.regional===S.reg).map(l=>l.praca),'Todas',S.praca);
 opt('fGvo',todas.filter(l=>(!S.reg||l.regional===S.reg)&&(!S.praca||l.praca===S.praca)).map(l=>l.gvo),'Todos',S.gvo);
}

function kpis(a,ls){
 const ch=(r,t)=>`<span class="ritmo ${tom(r)}">${t}</span>`;
 const por=c=>{const x=agg(ls.filter(l=>l.canal===c));return x.meta?`${c==='vd'?'VD':'Varejo'} ${kbrl(x.real)} de ${kbrl(x.meta)} (${pct(x.at)})`:''};
 const parte=S.canal==='total'?`<p class="kl">${[por('varejo'),por('vd')].filter(Boolean).join(' · ')}</p>`:'';
 $('kpis').innerHTML=`
  <div class="card kpi hero2"><p class="lbl">Realizado</p><p class="val">${kbrl(a.real)} <small>${pct(a.at,1)} da meta</small></p>
   <div class="prog"><i style="width:${Math.min(100,a.at*100)}%;background:var(--primary)"></i><b style="left:${Math.min(100,a.f*100)}%"></b></div>${parte}</div>
  <div class="card kpi"><p class="lbl">Meta do dia</p><p class="val">${kbrl(a.meta)}</p><p class="kl">falta <b>${kbrl(Math.max(0,a.meta-a.real))}</b></p></div>
  <div class="card kpi"><p class="lbl">Ritmo agora</p><p class="val ${a.ritmo==null?'':'c-'+tom(a.ritmo)}">${a.ritmo==null?'—':pct(a.ritmo)}</p>
   ${a.ritmo==null?'<p class="kl">sem venda registrada ainda</p>':`${ch(a.ritmo,a.ritmo>=1?'No ritmo':a.ritmo>=.9?'Atenção':'Abaixo')}<p class="kl">esperado até agora <b>${kbrl(a.esp)}</b> (${pct(a.f)} do dia)</p>`}</div>
  <div class="card kpi"><p class="lbl">Projeção do dia</p><p class="val ${a.proj==null?'':'c-'+tom(a.proj/a.meta)}">${a.proj==null?'—':kbrl(a.proj)}</p><p class="kl">${a.proj==null?'':`${pct(a.proj/a.meta)} da meta no ritmo atual`}</p></div>`;
}

function grafico(ls){
 const H=Array(24).fill(0),E=Array(24).fill(0);let meta=0;
 ls.forEach(l=>{l.h.forEach((v,i)=>H[i]+=v);meta+=l.meta;
  const curva=l.canal==='vd'?B.vd.curva:((B.varejo.curvas[l.dia]||{})[l.shopping?'shopping':'demais'])||[];
  let acc=0;for(let i=0;i<24;i++){acc+=curva[i]||0;E[i]+=l.meta*acc}});
 const ates=['varejo','vd'].filter(c=>S.canal==='total'||S.canal===c).map(c=>B[c].ate[S.dia]).filter(Boolean).sort();
 const ateH=S.dia<[ultimoDia('varejo'),ultimoDia('vd')].sort().pop()?23:ates.length?+ates[ates.length-1].slice(0,2):-1;
 const h0=7,h1=22,N=h1-h0+1,W=760,Ht=280,L=60,R=14,T=24,Bt=30,iw=W-L-R,ih=Ht-T-Bt,cw=iw/N;
 const acc=[];let s=0;for(let i=0;i<24;i++){s+=H[i];acc.push(s)}
 const MAX=Math.max(meta,acc[23],1)*1.08,x=i=>L+cw*(i-h0+.5),y=v=>T+(1-v/MAX)*ih;
 let g='';for(let k=0;k<=4;k++){const v=MAX/1.08*k/4;g+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${L-8}" y="${y(v)+4}" text-anchor="end">${kbrl(v)}</text>`}
 g+=`<line class="mt" x1="${L}" x2="${W-R}" y1="${y(meta)}" y2="${y(meta)}"/><text class="mtl" x="${W-R}" y="${y(meta)-6}" text-anchor="end">meta ${kbrl(meta)}</text>`;
 const hmax=Math.max(...H.slice(h0,h1+1),1);
 for(let i=h0;i<=h1;i++){g+=`<text class="ax" x="${x(i)}" y="${Ht-10}" text-anchor="middle">${i}h</text>`;
  if(H[i]>0)g+=`<rect class="hb ${i===ateH?'now':''}" x="${x(i)-cw*.3}" y="${T+ih-H[i]/hmax*ih*.35}" width="${cw*.6}" height="${H[i]/hmax*ih*.35}" rx="3"><title>${i}h: ${kbrl(H[i])}</title></rect>`}
 g+=`<polyline class="esp" points="${Array.from({length:N},(_,k)=>`${x(h0+k)+cw/2},${y(E[h0+k])}`).join(' ')}"/>`;
 if(ateH>=h0)g+=`<polyline class="rl" points="${Array.from({length:Math.min(ateH,h1)-h0+1},(_,k)=>`${x(h0+k)+cw/2},${y(acc[h0+k])}`).join(' ')}"/>`;
 $('chart').innerHTML=`<svg viewBox="0 0 ${W} ${Ht}" style="min-width:560px" role="img" aria-label="Vendido acumulado e esperado acumulado por hora">${g}</svg>`;
 $('curvaTxt').textContent=S.canal==='vd'?'VD (ERs): das 8h às 19h, pedidos faturados pela hora da autorização':S.canal==='varejo'?'Varejo: shopping até 22h; rua, galeria, hipermercado e cash & carry até 19h (curva das quintas e demais dias do mês)':'Varejo (shopping até 22h, demais até 19h) + VD (8h às 19h)';
}

function ranking(titulo,icone,chave,ls){
 const g={};ls.forEach(l=>{(g[l[chave]]=g[l[chave]]||[]).push(l)});
 const rows=Object.entries(g).map(([k,v])=>({nome:k,n:v.length,...agg(v)})).filter(r=>r.meta>0)
  .sort((a,b)=>(b.ritmo??-1)-(a.ritmo??-1)||b.at-a.at);
 return `<div class="card"><div class="card-hd"><div><h2>${titulo}</h2><p>${rows.length} · ordenado pelo ritmo agora</p></div><span class="mf">${ic(icone)}</span></div>
  <div class="rkl">${rows.map((r,i)=>`<div class="rkr"><span class="pos">${i+1}º</span><div style="min-width:0"><p class="nm" title="${esc(r.nome)}">${esc(r.nome)}</p><p class="sub">${r.n} ${S.canal==='vd'?'ER':'loja'}${r.n>1?'s':''} · ${kbrl(r.real)} de ${kbrl(r.meta)}</p></div>
   <span class="v">${pct(r.at)}<small>da meta</small></span><span class="pill ${tom(r.ritmo)}" title="realizado ÷ esperado até agora">${r.ritmo==null?'—':pct(r.ritmo)}</span></div>`).join('')||'<p class="pad mf">Sem dados.</p>'}</div></div>`;
}

function tabela(ls){
 const rows=[...ls].sort((a,b)=>(b.real/(b.esp||1e-9))-(a.real/(a.esp||1e-9)));
 $('cardLojas').innerHTML=`<div class="card-hd"><div><h2>${S.canal==='vd'?'ERs':S.canal==='varejo'?'Lojas':'Lojas e ERs'} (${rows.length})</h2><p>Ritmo = realizado ÷ esperado até agora</p></div></div>
  <div class="tw tall"><table><thead><tr><th>#</th><th>${S.canal==='vd'?'ER':'Loja'}</th>${S.canal==='total'?'<th>Canal</th>':''}<th>Praça</th><th>GVO</th><th class="r">Meta do dia</th><th class="r">Realizado</th><th class="r">% meta</th><th class="r">Esperado agora</th><th class="r">Ritmo</th><th class="r">Projeção</th></tr></thead><tbody>
  ${rows.map((l,i)=>{const r=l.esp>0?l.real/l.esp:null;return `<tr><td class="mf tnum">${i+1}</td><td><p class="nm">${esc(l.nome)}</p><p class="sub">${esc(l.id)}${l.canal==='varejo'?` · ${l.shopping?'shopping · até 22h':'até 19h'}`:''}</p></td>${S.canal==='total'?`<td>${l.canal==='vd'?'VD':'Varejo'}</td>`:''}
   <td>${esc(l.praca)}</td><td>${esc(l.gvo)}</td><td class="r tnum">${brl(l.meta)}</td><td class="r tnum"><b>${brl(l.real)}</b></td><td class="r tnum">${pct(l.meta?l.real/l.meta:0)}</td>
   <td class="r tnum mf">${brl(l.esp)}</td><td class="r"><span class="pill ${tom(r)}">${r==null?'—':pct(r)}</span></td><td class="r tnum">${r==null?'—':pct(r)}</td></tr>`}).join('')}
  </tbody></table></div>`;
}

function render(){
 $('tabs').innerHTML=CANAIS.map(([k,t,i])=>`<button class="tab ${S.canal===k?'on':''}" data-canal="${k}">${ic(i)}${t}</button>`).join('');
 const ls=linhas(),a=agg(ls);
 const sem=['varejo','vd'].filter(c=>S.canal==='total'||S.canal===c).flatMap(c=>B[c].semMeta.filter(x=>x.dia===S.dia).map(x=>({...x,c})));
 $('aviso').innerHTML=!ls.length?'<div class="aviso">Sem meta para este filtro.</div>':'';
 kpis(a,ls);grafico(ls);
 $('ranks').innerHTML=ranking('Regional','map','regional',ls)+ranking('Praça','map-pin','praca',ls)+ranking('GVO','user-round','gvo',ls);
 tabela(ls);
 const ateV=B.varejo.ate[S.dia],ateD=B.vd.ate[S.dia];
 $('hData').textContent=`${S.dia.slice(8)}/${S.dia.slice(5,7)} · Varejo até ${ateV||'—'} · VD até ${ateD||'—'}`;
 $('regras').innerHTML=`Varejo: cupons efetivados, receita líquida (−) trocas. VD: pedidos com NF emitida no dia, sem os cancelados pelo usuário, loja pela estrutura pai, valor do pedido.`+
  (sem.length?` Fora do ranking (venda sem meta da Beauty Week): ${kbrl(sum(sem.map(x=>x.real)))} em ${sem.length} loja(s)/ER(s): ${sem.map(x=>esc(x.id)+(S.canal==='total'?` (${x.c==='vd'?'VD':'Varejo'})`:'')).join(', ')}.`:'')+
  ` Atualizado em ${B.geradoEm.slice(8,10)}/${B.geradoEm.slice(5,7)} às ${B.geradoEm.slice(11,16)}.`;
 lucide.createIcons();
}

document.addEventListener('click',e=>{const t=e.target.closest('[data-canal]');if(t){S.canal=t.dataset.canal;render()}});
$('fDia').addEventListener('change',e=>{S.dia=e.target.value;render()});
$('fReg').addEventListener('change',e=>{S.reg=e.target.value;S.praca=S.gvo='';fillFiltros();render()});
$('fPraca').addEventListener('change',e=>{S.praca=e.target.value;S.gvo='';fillFiltros();render()});
$('fGvo').addEventListener('change',e=>{S.gvo=e.target.value;render()});
$('fLimpar').addEventListener('click',()=>{S.reg=S.praca=S.gvo='';fillFiltros();render()});

fetch('data/beauty.json?v='+Math.floor(Date.now()/60000),{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).then(j=>{
 B=j;S.dia=[ultimoDia('varejo'),ultimoDia('vd')].sort().pop()||B.dias[B.dias.length-1];fillFiltros();render();
 setInterval(()=>fetch('data/beauty.json?v='+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(k=>{B=k;render()}).catch(()=>{}),5*60000);
}).catch(()=>{$('aviso').innerHTML='<div class="aviso">Ainda não há dados da Beauty Week. Rode o processar_beauty.py.</div>'});
</script>
</body>
</html>
